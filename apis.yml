name: Surfe
kind: company
description: >-
  Surfe (formerly Leadjet) is a B2B contact-discovery and data-enrichment
  platform whose REST API turns partial signals - a LinkedIn URL, a name plus a
  company, a domain, or an email - into verified professional email addresses,
  mobile phone numbers, company firmographics, and lookalike account
  recommendations. It is the web-intelligence and contact-discovery layer that
  sits behind Surfe's LinkedIn and CRM experiences, exposed to developers under
  https://api.surfe.com/v2 with Bearer API-key auth and a credit-based model.
  Bulk people and company enrichment run as asynchronous jobs (start with POST,
  then poll the GET job endpoint or receive a webhook callback). This entry
  focuses on the contact-discovery, data-enrichment, and B2B/sales-intelligence
  use cases (people search, people enrichment, company search, company
  enrichment).
